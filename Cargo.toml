[workspace]
resolver = "2"
members = [
    "engine/common",
    "engine/fs",
    "engine/cpu",
    "engine/gpu",
    "engine/core",
    "recompiler",
    "recompiler/abi",
    "frontend",
    "android",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
zakuro-common = { path = "engine/common" }
zakuro-fs     = { path = "engine/fs" }
zakuro-cpu    = { path = "engine/cpu" }
zakuro-gpu    = { path = "engine/gpu" }
zakuro-core   = { path = "engine/core" }
recomp-abi    = { path = "recompiler/abi" }

log = "0.4"
thiserror = "2"
bitflags = "2"
rayon = "1"
memmap2 = "0.9"
bytemuck = { version = "1", features = ["derive"] }
parking_lot = "0.12"

[profile.dev]
opt-level = 1
debug = true

# The emulator is unusably slow in a plain debug build; give the hot crates -O2
# even in dev profile.
[profile.dev.package.zakuro-cpu]
opt-level = 3
[profile.dev.package.zakuro-gpu]
opt-level = 3
[profile.dev.package.zakuro-core]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "unwind"
debug = 1
