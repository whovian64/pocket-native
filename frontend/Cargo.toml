[package]
name = "pocket-native"
description = "Nintendo 3DS games recompiled for Linux handhelds"
version.workspace = true
edition.workspace = true
license.workspace = true

# a library too, which the Android app is built from as a shared library
# its activity loads
[lib]
name = "pocket_native"
crate-type = ["rlib", "cdylib"]

[dependencies]
zakuro-common.workspace = true
zakuro-core.workspace = true
log.workspace = true
env_logger = "0.11"
libc = "0.2"
libloading = "0.8"
zakuro-gpu.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.1", features = ["native-activity"] }
jni = "0.21"
ndk = { version = "0.9.0", features = ["audio"] }
