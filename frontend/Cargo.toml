[package]
name = "pocket-native"
description = "Nintendo 3DS games recompiled for Linux handhelds"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Diagnostic companion only; absent from normal builds.
profile-sidecar = []
# Diagnostic shader events; absent from normal builds.
shader-attribution = ["zakuro-gpu/shader-attribution"]

[dependencies]
zakuro-common.workspace = true
zakuro-core.workspace = true
log.workspace = true
env_logger = "0.11"
libc = "0.2"
libloading = "0.8"
zakuro-gpu.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"

[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.9.0", features = ["audio"] }
